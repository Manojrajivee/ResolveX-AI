# Server Configuration
server.port=8080
server.servlet.context-path=

# Spring MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/runbook_agent_db
spring.data.mongodb.database=runbook_agent_db

# JWT Security Configurations
# 256-bit (32-byte) secret key in hex/plain string format
app.jwt.secret=9a4f2c8d3b7a1e5f8c6b3a2f1e4d7c9b0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
# Token expiration time: 86400000 ms (24 hours)
app.jwt.expiration-ms=86400000

# Logging Configurations
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.resolvex.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload Configurations
app.upload.dir=uploads/runbooks

# OpenAI Service Settings
# Set your OpenAI API Key as an environment variable (OPENAI_API_KEY) or put it directly here
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.url=https://api.openai.com/v1/chat/completions
app.openai.model=gpt-4o-mini

# AI Chat Assistant Settings
app.ai.chat-model=gpt-4o-mini
app.ai.temperature=0.7
app.ai.system-prompt=You are an expert AI Troubleshooting Assistant for ResolveX AI. Help the engineer resolve the incident. Use the provided conversation history, incident details, and knowledge base articles to formulate a detailed response.

# Vector Embedding Settings
app.vector.embedding-url=https://api.openai.com/v1/embeddings
app.vector.embedding-model=text-embedding-3-small

